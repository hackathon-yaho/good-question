server:
  servlet:
    context-path: /api

spring:
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# ===== Custom App Config =====
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:604800000}   # 기본 7일

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}                     # 로컬 false / 배포(HTTPS) true

ai:
  server:
    # 실 AI 서버 주소 미결(U-01). 기본값은 우리 자신의 mock 스텁(B-11)을 가리킨다.
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8080/api/mock-ai}
    timeout-seconds: ${AI_SERVER_TIMEOUT_SECONDS:10}          # D-03, D-51 — AI 서버 재시도(최대 3회) 도입에 맞춰 5→10
    report-timeout-seconds: ${AI_SERVER_REPORT_TIMEOUT_SECONDS:60}  # parent-report-ai-generation.md — 비동기라 대화보다 여유, 실측 후 재조정 예정
    internal-token: ${AI_SERVER_INTERNAL_TOKEN:}              # U-01 해소. mock은 인증 없음, 값 없어도 동작

# STT/TTS 전용 키 — gpt-5-mini(AI 담당) 키와 분리 (D-16)
openai:
  api-key: ${OPENAI_API_KEY:}
  stt:
    model: gpt-transcribe   # D-47 — OpenAI 신형 추천 모델, WER 3.31%로 gpt-4o-transcribe(4.01%)보다 낮고 더 저렴
    timeout-seconds: 8        # D-03
  tts:
    model: gpt-4o-mini-tts     # D-35 — 캐릭터별 voice+instructions 연기를 쓰려고 tts-1에서 교체
    timeout-seconds: 8        # D-03에 없어 STT와 동일하게 맞춤 (D-21)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.goodquestion.backend: info
