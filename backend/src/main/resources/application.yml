server:
  servlet:
    context-path: /api

spring:
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# ===== Custom App Config =====
jwt:
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_VALIDITY:604800000}   # 기본 7일

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie-secure: ${COOKIE_SECURE:false}                     # 로컬 false / 배포(HTTPS) true

ai:
  server:
    # 실 AI 서버 주소 미결(U-01). 기본값은 우리 자신의 mock 스텁(B-11)을 가리킨다.
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8080/api/mock-ai}
    timeout-seconds: ${AI_SERVER_TIMEOUT_SECONDS:5}           # D-03

# STT/TTS 전용 키 — gpt-5-mini(AI 담당) 키와 분리 (D-16)
openai:
  api-key: ${OPENAI_API_KEY:}
  stt:
    model: whisper-1
    timeout-seconds: 8        # D-03
  tts:
    model: tts-1
    voice: alloy
    timeout-seconds: 8        # D-03에 없어 STT와 동일하게 맞춤 (D-21)

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  level:
    com.goodquestion.backend: info
