services:
  db:
    image: postgres:16
    container_name: goodquestion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: goodquestion
      POSTGRES_USER: gq
      POSTGRES_PASSWORD: gq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gq", "-d", "goodquestion"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
